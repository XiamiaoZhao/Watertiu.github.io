const PACK_VERSION=2;
const canonicalCity=s=>clean(s,60).replace(/\s/g,'').replace(/市$/,'');
const nameKey=s=>clean(s).replace(/[\s·（）()]/g,'');
const samePlace=(a,b)=>nameKey(a)===nameKey(b);
function generationNeeds(input,library){return input.cities.flatMap(c=>{const pack=library.cities.find(p=>canonicalCity(p.name)===canonicalCity(c.name));const all=pack?.routes.flatMap(r=>r.nodes)||[];const missing=input.must.filter(m=>canonicalCity(m.city)===canonicalCity(c.name)&&!all.some(p=>samePlace(p.name,m.name)));const shortage=Math.max(0,c.days-(pack?.routes.length||0));if(!shortage&&!missing.length)return [];return [{city:c.name,days:shortage||1,append:!!pack,must:missing.map(p=>p.name),exclude:all.map(p=>p.name),interests:input.interests,audio:input.audio}];});}
function mergePacks(library,packs){const out=clone(library);for(const p of packs){const at=out.cities.findIndex(c=>canonicalCity(c.name)===canonicalCity(p.name));if(at<0)out.cities.push(clone(p));else {const old=out.cities[at];const routeIDs=new Set(old.routes.map(r=>r.id));out.cities[at]={...old,...clone(p),routes:[...old.routes,...p.routes.filter(r=>!routeIDs.has(r.id))],foods:[...new Map([...old.foods,...p.foods].map(f=>[f.id,f])).values()],art:[...old.art,...p.art]};}}return out;}
function assertPack(p){if(!p||p.schemaVersion!==PACK_VERSION||typeof p.name!=='string'||!p.name.trim()||!Array.isArray(p.routes)||!p.routes.length||p.routes.length>8||!Array.isArray(p.foods)||!Array.isArray(p.art)||!p.art.length)throw Error('城市资料不完整，未替换原行程。');if(JSON.stringify(p).length>600000)throw Error('城市资料过大。');const ids=new Set();for(const r of p.routes){if(!r.id||!Array.isArray(r.nodes)||!r.nodes.length||r.nodes.length>10||!Array.isArray(r.snacks))throw Error('路线资料不完整。');for(const n of r.nodes){if(!n.id||ids.has(n.id)||!n.name||!n.intro||!Number.isFinite(n.lon)||!Number.isFinite(n.lat)||Math.abs(n.lon)>180||Math.abs(n.lat)>90)throw Error('景点缺少可用位置或介绍，请重试查询。');ids.add(n.id);}}if(!p.foods.some(f=>f.type==='restaurant')||!p.foods.some(f=>f.type==='snack'))throw Error('餐馆和小吃资料尚未补齐。');return p;}

function culturalArt(scene={},title=''){const motifs=(scene.motifs||['pavilion','house','bridge']).slice(0,4);const allowed=['pagoda','museum','bridge','gate','pavilion','house','twinpagoda','pearl','wukang','rock'];const palette={lake:['#e0e9df','#9fb6ad','#778e73'],coast:['#e0e9eb','#9ab9c1','#7a9583'],mountain:['#e5e7dd','#abbba8','#667d69'],city:['#eee3d4','#c8b8a3','#8d9987']}[scene.landscape]||['#e7e6d9','#b6c5ad','#7e957b'];const seed=Math.abs([...title].reduce((s,c)=>s+c.charCodeAt(0),0));return `<svg class="generated-day-art" viewBox="0 0 1100 390" preserveAspectRatio="xMidYMid slice" aria-label="${esc(title)}文化插画" role="img"><defs><linearGradient id="wash-${seed}" x2="1" y2="1"><stop stop-color="#f7f1e3"/><stop offset="1" stop-color="${palette[0]}"/></linearGradient></defs><rect width="1100" height="390" fill="url(#wash-${seed})"/><circle cx="${860-seed%100}" cy="81" r="41" fill="#d0a36c" opacity=".24"/><path d="M220 272Q340 130 430 232Q510 88 620 212Q740 107 845 229Q963 125 1100 224V390H220Z" fill="${palette[1]}" opacity=".25"/><path d="M410 300Q500 181 575 256Q690 174 770 268Q910 205 1100 277V390H410Z" fill="${palette[2]}" opacity=".15"/><path d="M350 350Q580 284 760 329T1150 319V390H350Z" fill="${palette[1]}" opacity=".46"/>${Array.from({length:7},(_,i)=>`<path d="M${500+i*75} ${350+i%3*9}h${38+i*8}" stroke="#faf7ec" stroke-width="2" opacity=".6"/>`).join('')}${motifs.map((k,i)=>`<g transform="translate(${535+i*155} ${310-(i%2)*23}) scale(${1.45-i*.12})">${sketchBuilding(allowed.includes(k)?k:'house',0,0)}</g>`).join('')}<g stroke="#65785b" fill="none" opacity=".5"><path d="M1015 390Q980 270 1050 174M1018 303q-47-13-59-55M1019 280q55-10 66-45" stroke-width="5"/>${[0,1,2,3,4,5].map(i=>`<ellipse cx="${975+i*18}" cy="${230+(i%3)*18}" rx="31" ry="12" fill="${palette[2]}" transform="rotate(${i*21} ${975+i*18} ${230+i%3*18})"/>`).join('')}</g><path d="M0 0H540V390H0Z" fill="#f8f4ea" opacity=".76"/><text x="1030" y="62" writing-mode="vertical-rl" fill="#5a6b56" font-family="serif" font-size="21" letter-spacing="7">${esc(scene.caption||title)}</text></svg>`;}

function createDrawing(nodes,geo={roads:[],water:[]}){const xs=nodes.map(n=>n.lon),ys=nodes.map(n=>n.lat);const left=Math.min(...xs),right=Math.max(...xs),bottom=Math.min(...ys),top=Math.max(...ys);const dx=Math.max(right-left,.004),dy=Math.max(top-bottom,.004);const project=([lon,lat])=>[Math.round(75+(lon-left)/dx*330),Math.round(520-(lat-bottom)/dy*350)];const points=nodes.map(n=>[...project([n.lon,n.lat]),n.kind||'house']);const path=ps=>ps.filter(p=>p.length===2&&p.every(Number.isFinite)).map((p,i)=>(i?'L':'M')+project(p).join(' ')).join(' ');return {nodes:points,roads:(geo.roads||[]).slice(0,22).filter(r=>r.points?.length>1).map(r=>[r.name,path(r.points),...project(r.points[Math.floor(r.points.length/2)]),0]),water:(geo.water||[]).slice(0,6).filter(r=>r.points?.length>2).map(r=>[path(r.points)+(r.polygon?' Z':''),r.name,...project(r.points[Math.floor(r.points.length/2)]),0]),snacks:[],source:geo.source||'',geoBounds:{left,right,bottom,top}};}
function routeSnacks(nodes,foods){return foods.filter(f=>f.type==='snack'&&Number.isFinite(f.lon)&&Number.isFinite(f.lat)).map(f=>({f,near:nodes.map(n=>({n,d:distance(n,f)})).sort((a,b)=>a.d-b.d)[0]})).filter(v=>v.near?.d<1.2).sort((a,b)=>a.near.d-b.near.d).slice(0,4).map(({f,near})=>({venueId:f.id,venueName:f.name,lon:f.lon,lat:f.lat,buy:f.dishes.join('、'),near:near.n.name,detour:`距${near.n.name}直线约 ${Math.max(50,Math.round(near.d*1000/50)*50)} 米`,sources:f.sources,note:f.tip}));}

function mapSvg(day){const ns=day.stops.filter(n=>Number.isFinite(n.lon)&&Number.isFinite(n.lat));if(!ns.length)return `<div class="empty-map"><span class="seal">寻路</span><h3>先选好地点，再描画这座城</h3><p>地点坐标尚未补齐，可先用下面的高德入口导航。</p></div>`;
 const drawing=day.drawing;const positions=day.mapPositions||{};let minX=Math.min(...ns.map(n=>n.lon)),maxX=Math.max(...ns.map(n=>n.lon)),minY=Math.min(...ns.map(n=>n.lat)),maxY=Math.max(...ns.map(n=>n.lat));const dx=Math.max(maxX-minX,.006),dy=Math.max(maxY-minY,.006);const pt=n=>drawing&&Array.isArray(positions[n.id])&&positions[n.id].slice(0,2).every(Number.isFinite)?positions[n.id]:[70+(n.lon-minX)/dx*340,550-(n.lat-minY)/dy*430];
 let bg='';if(drawing){for(const w of drawing.water||[])bg+=`<path d="${esc(w[0])}" fill="#c2d4ce" stroke="#a2beb7"/><text x="${+w[2]||220}" y="${+w[3]||180}" fill="#648a86" font-size="13" transform="rotate(${+w[4]||0} ${+w[2]||220} ${+w[3]||180})">${esc(w[1])}</text>`;for(const r of drawing.roads||[])bg+=`<path d="${esc(r[1])}" stroke="#dcd4bb" stroke-width="12" fill="none"/><path d="${esc(r[1])}" stroke="#fdf8e9" stroke-width="8" fill="none"/><text x="${+r[2]||120}" y="${+r[3]||130}" fill="#8b8571" font-size="10" transform="rotate(${+r[4]||0} ${+r[2]||120} ${+r[3]||130})">${esc(r[0])}</text>`;}
 const coords=ns.map(pt);const line=coords.map(p=>p.slice(0,2).join(',')).join(' ');

function dayPicker(plan,active){return `<label class="day-select">选择日期 <select id="walk-date">${plan.days.map((d,i)=>`<option value="${i}" ${i===active?'selected':''}>${esc(d.date)} · ${esc(d.city)}</option>`).join('')}</select></label>`;}
function walksPage(plan,active){const d=plan.days[active];return `${dayPicker(plan,active)}${unlocatedNotice(d)}<div class="walk-layout"><div><div class="map-tools"><h2>${esc(d.title)}</h2><button data-zoom="1" aria-label="放大地图">＋</button><button data-zoom="-1" aria-label="缩小地图">－</button></div><div class="map-scroll">${mapSvg(d)}</div></div><aside id="spot-panel" class="spot-panel">${d.stops[0]?spotDetail(d.stops[0],d.city):'<h3>选择路线上的一站</h3>'}</aside></div><div class="segment-list">${d.stops.map((n,i)=>`<div class="segment"><span class="number">${i+1}</span><button data-detail="${esc(n.id)}">${esc(n.name)}</button>${i<d.legs.length?`<small>↓ ${esc(d.legs[i].mode)} ${esc(d.legs[i].label)}</small>`:''}</div>`).join('')}</div>`;}
function foodPage(plan){const foods=[...new Map(plan.days.flatMap(d=>d.foods).map(f=>[f.id,f])).values()];return ['restaurant','snack'].map(type=>`<section><div class="section-line"><h2>${type==='restaurant'?'坐下来，好好吃饭':'走到哪里，尝到哪里'}</h2><span>${type==='restaurant'?'地方饭店':'顺路小吃'}</span></div><div class="card-grid">${foods.filter(f=>f.type===type).map(f=>`<article class="food-card"><span class="eyebrow">${esc(f.city)} · ${esc(f.area)}</span><h3>${esc(f.name)}</h3><p class="dish">${esc(f.dishes?.join(' / '))}</p><p>${esc(f.tip)}</p><small>${esc(f.budget||f.budgetCnyPerPerson?.join('–')+' 元 / 人 · 参考')}</small><div class="actions">${appLink('meituan',f.city,f.name,'美团搜店')}${appLink('amap',f.city,f.name,'高德')}${appLink('xhs',f.city,f.name,'小红书')}</div></article>`).join('')||'<p class="empty">这些目的地的餐饮资料还未入库。可从高德或美团搜索附近门店。</p>'}</div></section>`).join('');}
function ticketsPage(plan){const ns=[...new Map(plan.days.flatMap(d=>d.stops.map(n=>({...n,city:d.city,date:d.date}))).map(n=>[n.id,n])).values()];return `<div class="section-line"><h2>先约好，再出发</h2><span>门票与预约分开核对</span></div><div class="ticket-list">${ns.map(n=>`<article><div><span class="eyebrow">${esc(n.date)} · ${esc(n.city)}</span><h3>${esc(n.name)}</h3></div>${ticketMarkup(n.ticket)}</article>`).join('')}</div>`;}
function stayPage(plan){return `<h2>每晚有落脚，每程有着落</h2><div class="card-grid">${plan.input.hotels.map(h=>`<article class="food-card"><span class="chip">${h.confirmed?'已订':'待订'} · ${esc(h.city)}</span><h3>${esc(h.name)}</h3><p>${esc(h.checkin)} → ${esc(h.checkout)}</p><p>${esc(h.address)}</p><p>${esc(h.room)} ${h.cost?'· ¥'+esc(h.cost):''}</p>${appLink('amap',h.city,h.address+' '+h.name,'高德前往')}</article>`).join('')||'<p class="empty">没有公开的酒店信息。</p>'}</div><h2>城际交通</h2><div class="card-grid">${plan.input.transport.map(t=>`<article class="food-card"><span class="chip">${t.confirmed?'已购':'备选'} · ${esc(MODE[t.mode])}</span><h3>${esc(t.from)} → ${esc(t.to)}</h3><b>${esc(t.code)}</b><p>${esc(t.depart.replace('T',' '))} 出发<br>${esc(t.arrive.replace('T',' '))} 到达</p><p>${esc(t.fromStation)} → ${esc(t.toStation)}</p><div class="actions">${appLink('amap',t.from,t.fromStation||t.from+'站','出发站导航')}${appLink('amap',t.to,t.toStation||t.to+'站','到达站导航')}</div></article>`).join('')||'<p class="empty">没有公开的已购交通。</p>'}</div><div class="actions">${webLink('https://www.12306.cn/','12306 查车次')}${webLink('https://m.ctrip.com/html5/flight/swift/index','查航班')}</div>`;}
function narrationMarkup(n){const g=n.narration;if(!g)return '';return `<section class="narration"><h3>听一段${esc(n.name)}的故事</h3><div class="narration-text">${esc(g.text).split('\n').map(s=>'<p>'+s+'</p>').join('')}</div><div class="actions"><button data-narration="${esc(n.id)}" class="primary">播放语音讲解</button></div><div class="narration-player" data-player="${esc(n.id)}"></div><div class="small-note">${(g.sources||[]).map(s=>webLink(s.url,s.title||'讲解来源')).join(' · ')}</div></section>`;}
function guidesPage(plan){return `<div class="section-line"><h2>把故事，听进风景里</h2><span>地图 · 历史 · 工艺</span></div><div class="card-grid">${plan.guides.map(g=>`<article class="guide-card">${photo(g.photo)}<div><span class="eyebrow">${esc(g.city)}</span><h3>${esc(g.name)}</h3>${g.url?webLink(g.url,'开始地图语音导览'):`<button data-page="walks" data-select-day="${g.dayIndex}" class="text-button">在今日地图中查看 ↗</button>${narrationMarkup(g)}`}</div></article>`).join('')||'<p class="empty">在旅行偏好中启用讲解后，可在这里选择景点。</p>'}</div>`;}
function weatherPage(plan){return `<div class="section-line"><h2>每天的晴雨冷暖</h2><button id="refresh-weather">更新预报</button></div><div id="weather-note" class="muted">预报获取后显示每日最高 / 最低温，未进入预报期不估造温度。</div><div class="card-grid" id="weather-cards">${plan.days.map(d=>`<article class="weather-card" data-weather-date="${esc(d.date)}" data-weather-city="${esc(d.city)}"><span>${esc(d.date)} · ${esc(d.city)}</span><h3>— / — °C</h3><p>暂无对应日期预报</p></article>`).join('')}</div>`;}
function checklistPage(plan){const items=[...plan.todo,'出发前复核营业时间、预约和票价','携带有效证件、常用药、充电宝与雨具','保存行程文件，确认返程车站 / 机场'];return `<h2>把琐事留在出发前</h2><div class="checklist">${items.map((t,i)=>`<label><input type="checkbox" data-check="${i}"><span>${esc(t)}</span></label>`).join('')}</div>`;}
function renderPage(plan,page='days',active=0){active=Math.min(Math.max(active,0),plan.days.length-1);return ({days:daysPage,walks:walksPage,food:foodPage,tickets:ticketsPage,stay:stayPage,guides:guidesPage,weather:weatherPage,checklist:checklistPage}[page]||daysPage)(plan,active);}
function renderShell(plan,page='days',active=0){return `<header class="viewer-header"><a href="${APP_URL}" class="brand"><img src="${APP_URL}assets/logo.webp" alt="行整"><span>行！整！<small>专属旅行手册</small></span></a><details class="directory"><summary>☰ 目录</summary><nav>${PAGES.map(([id,name])=>`<button data-page="${id}" ${id===page?'aria-current="page"':''}>${name}</button>`).join('')}<a href="${APP_URL}">创建我的旅行</a></nav></details></header><div class="trip-title"><div><span class="eyebrow">${esc(plan.input.start)} — ${esc(plan.input.end)} · ${plan.input.people} 人同行</span><h1>${esc(plan.title)}</h1></div><span class="seal">行<br>整</span></div><nav class="page-tabs">${PAGES.map(([id,name])=>`<button data-page="${id}" class="${page===id?'active':''}">${name}</button>`).join('')}</nav><main id="trip-content">${renderPage(plan,page,active)}</main><footer class="viewer-footer">行！整！ · 走进山川，也走进故事。<button id="print-trip">打印本页</button></footer>`;}
function bindViewer(root,plan,state,onNavigate){let scale=1;root.onclick=e=>{const audio=e.target.closest('[data-narration]');if(audio){root.dispatchEvent(new CustomEvent('play-narration',{bubbles:true,detail:{id:audio.dataset.narration,button:audio}}));return;}const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;if(page.dataset.selectDay)state.day=+page.dataset.selectDay;onNavigate();return;}const day=e.target.closest('[data-day]');if(day){state.day=+day.dataset.day;onNavigate();return;}const target=e.target.closest('[data-spot],[data-detail]');if(target){const d=plan.days[state.day],n=d.stops.find(n=>n.id===(target.dataset.spot||target.dataset.detail));if(!n)return;const panel=root.querySelector('#spot-panel');if(panel){panel.innerHTML=spotDetail(n,d.city);if(innerWidth<800)panel.scrollIntoView({behavior:'smooth',block:'start'});}else{const dialog=document.createElement('dialog');dialog.className='detail-dialog';dialog.innerHTML='<button class="close-dialog">×</button>'+spotDetail(n,d.city);dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();root.append(dialog);dialog.showModal();}return;}const snack=e.target.closest('[data-snack]');if(snack){const s=plan.days[state.day].snacks[+snack.dataset.snack];const panel=root.querySelector('#spot-panel');panel.innerHTML=`<span class="eyebrow">顺路尝一口</span><h2>${esc(s.venueName)}</h2><p>${esc(s.buy)}</p><p>${esc(s.detour)}</p><p>${esc(s.note)}</p>${appLink('meituan',plan.days[state.day].city,s.venueName,'美团搜这家')}`;if(innerWidth<800)panel.scrollIntoView({behavior:'smooth'});}const zoom=e.target.closest('[data-zoom]');if(zoom){scale=Math.max(1,Math.min(2.5,scale + +zoom.dataset.zoom*.25));const svg=root.querySelector('.walk-art');if(svg){svg.style.width=scale*100+'%';svg.style.maxWidth='none';}}if(e.target.closest('#print-trip'))window.print();};root.onchange=e=>{if(e.target.id==='walk-date'){state.day=+e.target.value;onNavigate();}if(e.target.matches('[data-check]')){try{localStorage.setItem('xz-check:'+plan.title+':'+e.target.dataset.check,e.target.checked?'1':'0');}catch{}}};root.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-spot],g[data-snack]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}};for(const c of root.querySelectorAll('[data-check]')){try{c.checked=localStorage.getItem('xz-check:'+plan.title+':'+c.dataset.check)==='1';}catch{}}}

const CITY_GEO={'徐州':[34.261,117.185],'苏州':[31.299,120.585],'上海':[31.230,121.474],'福州':[26.075,119.296],'泉州':[24.875,118.675]};
const weatherName=n=>n===0?'晴':n<4?'多云':n<50?'雾':n<70?'雨':n<80?'雪':n<95?'阵雨':'雷雨';
async function loadWeather(root,plan){const note=root.querySelector('#weather-note'),btn=root.querySelector('#refresh-weather');if(!note)return;if(btn)btn.disabled=true;note.textContent='正在查询最新预报…';let got=0,failed=0;const cities=[...new Set(plan.days.map(d=>d.city))];for(const city of cities){const generatedGeo=plan.days.find(d=>d.city===city&&d.geo)?.geo;const geo=CITY_GEO[city]||(generatedGeo?[generatedGeo.lat,generatedGeo.lon]:null);if(!geo){failed++;continue;}try{const key='xz-weather:'+city+':'+new Date().toISOString().slice(0,10);let data;try{const cache=JSON.parse(sessionStorage.getItem(key)||'null');if(cache&&Date.now()-cache.time<3600000)data=cache.data;}catch{}if(!data){const url=`https://api.open-meteo.com/v1/forecast?latitude=${geo[0]}&longitude=${geo[1]}&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=16&timezone=Asia%2FShanghai`;const r=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('weather');data=await r.json();if(!data.daily?.time)throw Error('weather');try{sessionStorage.setItem(key,JSON.stringify({time:Date.now(),data}));}catch{}}for(const el of root.querySelectorAll('[data-weather-date]')){if(el.dataset.weatherCity!==city)continue;const index=data.daily.time.indexOf(el.dataset.weatherDate);if(index<0)continue;const hi=data.daily.temperature_2m_max[index],lo=data.daily.temperature_2m_min[index];if(hi==null||lo==null)continue;el.querySelector('h3').textContent=`${Math.round(hi)} / ${Math.round(lo)} °C`;el.querySelector('p').textContent=weatherName(data.daily.weather_code[index]);got++;}}catch{failed++;}}
note.innerHTML=`${got?'已更新 '+got+' 天。':'当前未获取到行程日期的预报。'}${failed?'部分城市查询失败或暂无坐标。':''} 超过预报期的日期保持空缺。<br><small>${esc(new Date().toLocaleString('zh-CN'))} · <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> / <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></small>`;if(btn)btn.disabled=false;}
function installNarration(root,getPlan){if(root.dataset.narrationBound)return;root.dataset.narrationBound='1';const audioCache=new Map();root.addEventListener('play-narration',async e=>{const {id,button}=e.detail;const plan=getPlan();const n=plan.guides.find(g=>g.id===id)||plan.days.flatMap(d=>d.stops).find(n=>n.id===id);if(!n?.narration)return;const base=plan.serviceBase||((location.hostname==='127.0.0.1'||location.hostname==='localhost')?location.origin:'');const box=button.closest('.narration').querySelector('.narration-player');if(!base){box.textContent='合成语音服务正在接入，讲解文字已完整保存。';return;}button.disabled=true;box.textContent='正在准备语音，首次合成稍需等待…';try{let speechCost={estimatedCNY:0,complete:true};let url=audioCache.get(n.narration.key);if(!url){const r=await fetch(base+'/api/narration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:n.narration.key}),signal:AbortSignal.timeout(150000)});if(!r.ok){const err=await r.json();throw Error((err.error||'语音生成失败')+(err.billing?' · 本次语音已知费用估算 ¥'+Number(err.billing.estimatedCNY||0).toFixed(4)+(err.billing.complete?'':'（用量未完整返回）'):''));}try{speechCost=JSON.parse(r.headers.get('X-Xingzheng-Cost')||'null')||{complete:false};}catch{speechCost={complete:false};}url=URL.createObjectURL(await r.blob());audioCache.set(n.narration.key,url);}box.innerHTML='<audio controls preload="auto"></audio><div class="actions"><button data-skip="-15">后退 15 秒</button><button data-skip="15">前进 15 秒</button><label>速度 <select><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label></div>';const fee=document.createElement('p');fee.className='small-note';fee.textContent='本次语音费用估算 '+(speechCost.complete?'':'已知至少 ')+'¥'+Number(speechCost.estimatedCNY||0).toFixed(4)+' · 不含云服务费，以账单为准';box.append(fee);const audio=box.querySelector('audio');audio.src=url;box.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{audio.currentTime=Math.max(0,Math.min(audio.duration||Infinity,audio.currentTime+Number(b.dataset.skip)));});box.querySelector('select').onchange=e=>audio.playbackRate=Number(e.target.value);try{await audio.play();}catch{}}catch(err){box.textContent=err.message;}finally{button.disabled=false;}});}

async function bootViewer(){const root=document.getElementById('viewer');try{let plan=window.XINGZHENG_PLAN?assertPlan(window.XINGZHENG_PLAN):await decodePlan(location.hash.slice(1),LIBRARY);const params=new URLSearchParams(location.search);const state={page:params.get('page')||'days',day:Math.max(0,Math.min(plan.days.length-1,Number(params.get('day'))||0))};function draw(){root.innerHTML=renderShell(plan,state.page,state.day);bindViewer(root,plan,state,()=>{const url=new URL(location.href);url.searchParams.set('page',state.page);url.searchParams.set('day',state.day);history.replaceState(null,'',url);draw();});root.querySelector('#refresh-weather')?.addEventListener('click',()=>loadWeather(root,plan));document.title=plan.title+' · 行！整！';}draw();installNarration(root,()=>plan);installAppLinks();}catch(err){root.innerHTML='<div class="admin-main"><h1>这份行程暂时打不开</h1><p>'+esc(err.message)+'</p><a href="'+APP_URL+'">返回创建行程</a></div>';}}
bootViewer();

})();</script></body></html>
